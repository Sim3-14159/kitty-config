# Number of lines high (e.g., 20) or percentage/pixels (e.g., 400px)
lines 25

# Edge of screen: top, bottom, left, right, center, or center-sized
edge center-sized

# Hide when the window loses keyboard focus, including when switching apps
hide_on_focus_loss yes

# Hide the window title bar and borders
kitty_override hide_window_decorations=yes

# Set window opacity (0.0 to 1.0)
background_opacity 0.98
